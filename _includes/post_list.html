{%- assign posts = include.posts | default: site.posts -%}
{%- if posts.size > 0 -%}
<ul class="posts">
  {%- for post in posts -%}
  <li>
    <span>{{ post.date | date: site.theme_config.date_format }}</span>
    <a href="{{ post.url | relative_url }}">{{ post.title }}{% if post.author %} — {{ post.author }}{% endif %}</a>
  </li>
  {%- endfor -%}
</ul>
{%- endif -%}
