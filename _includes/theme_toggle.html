<button class="sw" id="theme-toggle" type="button" aria-label="Tema değiştir">
  <span id="sw-light">gündüz</span>
  <span class="sw-dot">·</span>
  <span id="sw-dark">gece</span>
</button>
<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  var html = document.documentElement;
  var swLight = document.getElementById('sw-light');
  var swDark  = document.getElementById('sw-dark');

  function isDark(){
    if (html.dataset.theme) return html.dataset.theme === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function update(){
    var dark = isDark();
    swLight.className = dark ? '' : 'on';
    swDark.className  = dark ? 'on' : '';
  }

  update();

  btn.addEventListener('click', function(){
    html.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', html.dataset.theme); } catch (e) {}
    update();
  });

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
    if (!html.dataset.theme) update();
  });
})();
</script>
