{%- if page.layout == 'home' -%}

<img src="{{ "/banner.jpg" | relative_url }}" alt="Kırmızı Süvariler - Kazimir Maleviç" class="banner-img">

<div class="masthead">
  <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
  {%- if site.motto -%}
  <div class="motto">{{ site.motto }}</div>
  {%- endif -%}
</div>

{%- else -%}

<div class="masthead masthead--compact">
  <a href="{{ "/" | relative_url }}" class="site-link">{{ site.title }}</a>
</div>

{%- endif -%}

<nav id="site-nav">
<button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">menü</button>
{%- for item in site.data.menu.entries -%}
  <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="on"{% endif %}>{{ item.title }}</a>
{%- endfor -%}
{%- include theme_toggle.html -%}
</nav>
<script>
(function(){
  var btn = document.getElementById('nav-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  function setOpen(open){
    nav.classList.toggle('nav--open', open);
    btn.textContent = open ? 'kapat' : 'menü';
    btn.setAttribute('aria-expanded', String(open));
  }
  btn.addEventListener('click', function(){
    setOpen(!nav.classList.contains('nav--open'));
  });
  // Link'e tıklayınca menüyü kapat
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ setOpen(false); });
  });
})();
</script>
