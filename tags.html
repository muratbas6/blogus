---
layout: default
permalink: /tags/
---
<a href="{{ "/" | relative_url }}">{{ site.theme_config.back_home_text }}</a>

<h1>tags</h1>

<ul>
{%- assign sorted_tags = site.tags | sort -%}
{%- for tag in sorted_tags -%}
  <li><a href="{{ "/tags/" | relative_url }}{{ tag[0] }}/">{{ tag[0] }}</a> ({{ tag[1].size }})</li>
{%- endfor -%}
</ul>
