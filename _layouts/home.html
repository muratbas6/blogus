---
layout: default
---
{%- include site_header.html -%}

<div class="index">
{%- for post in site.posts -%}
  <a href="{{ post.url | relative_url }}" class="row">
    <div class="date">{{ post.date | date: site.theme_config.date_format }}</div>
    <div class="title">{{ post.title }}{% if post.author %}<em> — {{ post.author }}</em>{% endif %}</div>
  </a>
{%- endfor -%}
</div>
